---
- name: Configure network device identity
  hosts: routers
  gather_facts: false
  vars_files:
    - ../vars/vault.yml

  tasks:
    - name: Configure GigabitEthernet2 — LAN1 (192.168.10.0/24)
      cisco.ios.ios_config:
        lines:
          - ip address 192.168.10.1 255.255.255.0
          - no shutdown
        parents: interface GigabitEthernet2

    - name: Configure GigabitEthernet3 — LAN2 (192.168.20.0/24)
      cisco.ios.ios_config:
        lines:
          - ip address 192.168.20.1 255.255.255.0
          - no shutdown
        parents: interface GigabitEthernet3

    - name: Create local user account
      cisco.ios.ios_config:
        lines:
          - username {{ vault_router_user }} privilege 15 password {{ vault_router_password }}

    - name: Set login banner (MOTD)
      cisco.ios.ios_banner:
        banner: motd
        text: |
          ******************************************
          *   Group Nahj -- nahj-net-automation   *
          *   Authorized access only              *
          *   SECR3253 Network Programming        *
          ******************************************
        state: present
