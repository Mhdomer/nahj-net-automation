---
- name: Configure routing and retrieve device info
  hosts: routers
  gather_facts: false
  vars_files:
    - ../vars/vault.yml

  tasks:
    - name: Set description on GigabitEthernet2 (LAN1)
      cisco.ios.ios_config:
        lines:
          - description Nahj LAN1 - Managed by Ansible
        parents: interface GigabitEthernet2

    - name: Set description on GigabitEthernet3 (LAN2)
      cisco.ios.ios_config:
        lines:
          - description Nahj LAN2 - Managed by Ansible
        parents: interface GigabitEthernet3

    - name: Add static route — LAN2 reachable via GigabitEthernet3
      cisco.ios.ios_config:
        lines:
          - ip route 192.168.20.0 255.255.255.0 GigabitEthernet3
          
    - name: Retrieve running configuration
      cisco.ios.ios_command:
        commands:
          - show running-config
          - show version
          - show ip interface brief
      register: device_info

    - name: Display device information
      ansible.builtin.debug:
        msg: "{{ device_info.stdout_lines }}"
